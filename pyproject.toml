[tool.black]
skip-string-normalization = true

[tool.pylint.main]
# generated by protoc
ignore-patterns = ['.*_pb2\.py$']

[tool.pylint.typecheck]
# not installed in the build environment, generated on install, or imported
# via sys.path changes
ignored-modules = [
    "ariadne",
    "configtree",
    "defaults",
    "generate_cache",
    "graphql",
    "makefun",
    "multipart",
    "op_definition",
    "pam",
    "pydantic",
    "pyroute2",
    "vici",
    "vpp_papi",
    "vyos.xml_ref",
]
# pydantic v2 API, the build environment has v1
generated-members = ["model_.*"]
