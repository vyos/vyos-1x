name: Trigger VyOS ISO integration Test

on:
  pull_request_target:
    branches:
      - current
      - circinus
      - sagitta

permissions:
  pull-requests: write
  contents: read

jobs:
  package-smoketest-current:
    if: ${{ github.event.pull_request.base.ref == 'current' }}
    uses: ./package-smoketest.yml@current
    secrets: inherit
  package-smoketest-circinus:
    if: ${{ github.event.pull_request.base.ref == 'circinus' }}
    uses: ./package-smoketest.yml@circinus
    secrets: inherit
  package-smoketest-sagitta:
    if: ${{ github.event.pull_request.base.ref == 'sagitta' }}
    uses: ./package-smoketest.yml@sagitta
    secrets: inherit
