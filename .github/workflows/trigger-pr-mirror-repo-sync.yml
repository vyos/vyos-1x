name: Trigger Mirror PR and Repo Sync
on:
  pull_request_target:
      types:
        - closed
      branches:
        - current
permissions:
  pull-requests: write
  contents: write
  issues: write
jobs:
  call-trigger-mirror-pr-repo-sync:
    if: github.repository_owner == 'vyos'
    uses: vyos/.github/.github/workflows/pr-mirror-repo-sync.yml@T7613-mirror-from-source-org
    secrets: inherit
