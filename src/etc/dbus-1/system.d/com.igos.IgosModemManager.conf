<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- This configuration file specifies the required security policies
       for iGOS WWAN Interface Manager to function correctly. -->

  <!-- Allow root to own and communicate with the IGOS ModemManager service -->
  <policy user="root">
    <allow own="com.igos.IgosModemManager"/>
    <allow send_destination="com.igos.IgosModemManager"/>
    <allow receive_sender="com.igos.IgosModemManager"/>
  </policy>

  <!-- Allow the vyos system user to own and communicate with the IGOS ModemManager service -->
  <policy user="vyos">
    <allow own="com.igos.IgosModemManager"/>
    <allow send_destination="com.igos.IgosModemManager"/>
    <allow receive_sender="com.igos.IgosModemManager"/>
  </policy>

  <!-- Allow any user in the vyosadmin group to communicate with the service -->
  <policy group="vyattacfg">
    <allow send_destination="com.igos.IgosModemManager"/>
    <allow receive_sender="com.igos.IgosModemManager"/>
  </policy>

  <!-- Allow any user in the vyosop group to communicate with the service -->
  <policy group="vyattaop">
    <allow send_destination="com.igos.IgosModemManager"/>
    <allow receive_sender="com.igos.IgosModemManager"/>
  </policy>

  <!-- Default policy: deny ownership but allow communication for reading status -->
  <policy context="default">
    <deny own="com.igos.IgosModemManager"/>
    <allow send_destination="com.igos.IgosModemManager"
           send_interface="com.igos.IgosModemManager.Status"/>
    <allow receive_sender="com.igos.IgosModemManager"/>
  </policy>

</busconfig>
