
# The config file should be located in the same directory as this script,
# with the filename 'my_config.conf'.
# Its format is simple key=value pairs, one per line, for example:
#
# Each parameter shows:  # Default: <value> | Values: <accepted>

# ============================================================================
# ENHANCED RECONNECTION STRATEGY CONFIGURATION
# ============================================================================

# Enhanced reconnection with signal quality validation
# Default: enabled | Values: enabled, disabled
enhanced_reconnection = enabled

# Signal quality threshold for reconnection attempts (in dBm)
# Default: -85 | Values: integer (dBm, typically -50 to -120)
reconnection_signal_threshold = -85

# Retry interval when signal > 50% (seconds)
# Default: 15 | Values: positive integer
retry_interval_good_signal = 30

# Retry interval when signal < 20% (seconds)
# Default: 45 | Values: positive integer
retry_interval_poor_signal = 120

# Maximum time to wait for signal improvement before reconnection (seconds)
# Default: 120 | Values: positive integer
max_wait_for_signal = 120

# Signal monitoring interval during recovery (seconds)
# Default: 10 | Values: positive integer
signal_check_interval = 10

# Signal strength buffer to prevent oscillation (in dBm)
# Default: 5 | Values: positive integer
signal_strength_buffer = 5

# ============================================================================
# BASIC INTERFACE CONFIGURATION - This is equivalent to WWAN0, WWAN1, ...
# ============================================================================

# Interface number (maps to wwan0, wwan1, etc.)
# Default: 0 | Values: 0+
interface_number=0

# Admin disable — when true, the service disconnects the modem and suppresses
# all activity for this interface.  When false (default), normal operation.
# Default: false | Values: true, false
interface_disabled=false

# Interface MTU — ceiling for bearer-provided MTU; also used as fallback when bearer provides none
# Per-SIM mtu (sim_slot_N_mtu) overrides this when that SIM is active
# Default: 1420 | Values: 576-9000
mtu=1420

# ============================================================================
# SIM CONFIGURATION
# ============================================================================

# Which SIM slot to use
# Default: 1 | Values: 1, 2
primary_sim_slot=1

# SIM failover - auto-switch to backup SIM on failure
# Default: enabled | Values: enabled, disabled
sim_failover=enabled

# SIM failback - automatically revert to primary SIM when it becomes available
# Only active after a sim-failover has occurred
# Default: enabled | Values: enabled, disabled
sim_failback_enabled=enabled

# How often to check if the primary SIM is available again (seconds)
# Default: 600 | Values: integer >= 60
sim_failback_check_interval=600

# ── SIM Slot 1 Configuration ────────────────────────────────────────────────

# APN name for this SIM's carrier
# Default: (empty, uses auto-discovery or global 'apn') | Values: string
sim_slot_1_apn=

# APN authentication username
# Default: (empty) | Values: string (required if auth_type is not 'none')
sim_slot_1_username=

# APN authentication password
# Default: (empty) | Values: string
sim_slot_1_password=

# APN authentication type
# Default: none | Values: none, pap, chap, both
sim_slot_1_auth_type=chap

# PDP context type
# Default: ipv4 | Values: ipv4, ipv6, ipv4v6
sim_slot_1_pdp_type=ipv4v6

# Allow roaming on this SIM
# Default: disabled | Values: enabled, disabled
sim_slot_1_roaming=enabled

# SIM PIN code (4-8 digits)
# Default: (empty) | Values: 4-8 digit string
sim_slot_1_pin=1234

# SIM PUK code (exactly 8 digits, for SIM recovery)
# Default: (empty) | Values: 8 digit string
sim_slot_1_puk=

# ICCID lock — if set, only a SIM with this ICCID is accepted in this slot (tamper prevention)
# Default: (empty, no lock) | Values: 19-20 digit ICCID string
sim_slot_1_iccid=

# Supported bands for this SIM (specific bands only; use network_mode for technology selection)
# Default: all | Values: all, or specific band names e.g. eutran-7,ngran-78 (comma-separated)
sim_slot_1_supported_bands=all

# Preferred carrier/operator name
# Default: (empty) | Values: string (operator name)
sim_slot_1_preferred_carrier=

# Enable automatic network scanning for this SIM
# Default: false | Values: true, false
sim_slot_1_enable_network_scan=false

# Per-SIM MTU override (0 = use interface mtu)
# Default: 0 | Values: 0, or 576-9000
sim_slot_1_mtu=0

# Per-SIM data limit in bytes (0 = unlimited)
# Default: 0 | Values: integer >= 0 (bytes)
sim_slot_1_data_limit_size=5000000000

# Action when this SIM's data limit is reached
# Default: none | Values: none, disable, sim-failover, sim-failover-sticky
sim_slot_1_data_limit_action=disable

# Warning thresholds as percentages of the data limit (comma-separated; empty = no warnings)
# Default: (empty) | Values: comma-separated integers 1-100
sim_slot_1_data_limit_warning=75,90,95

# Billing cycle start day of month for this SIM (usage resets on this date)
# Default: 1 | Values: integer 1-28
sim_slot_1_data_limit_billing_date=1

# ── SIM Slot 2 Configuration (backup) ───────────────────────────────────────

# Default: (empty) | Values: string
sim_slot_2_apn=

# Default: (empty) | Values: string
sim_slot_2_username=

# Default: (empty) | Values: string
sim_slot_2_password=

# Default: none | Values: none, pap, chap, both
sim_slot_2_auth_type=none

# Default: ipv4 | Values: ipv4, ipv6, ipv4v6
sim_slot_2_pdp_type=ipv4

# Default: disabled | Values: enabled, disabled
sim_slot_2_roaming=disabled

# Default: (empty) | Values: 4-8 digit string
sim_slot_2_pin=5678

# Default: (empty) | Values: 8 digit string
sim_slot_2_puk=

# ICCID lock — if set, only a SIM with this ICCID is accepted in this slot (tamper prevention)
# Default: (empty, no lock) | Values: 19-20 digit ICCID string
sim_slot_2_iccid=

# Default: all | Values: all, or specific band names e.g. eutran-7,ngran-78 (comma-separated)
sim_slot_2_supported_bands=all

# Default: (empty) | Values: string
sim_slot_2_preferred_carrier=

# Default: false | Values: true, false
sim_slot_2_enable_network_scan=false

# Per-SIM MTU override (0 = use interface mtu)
# Default: 0 | Values: 0, or 576-9000
sim_slot_2_mtu=0

# Default: 0 | Values: integer >= 0 (bytes; 0 = unlimited)
sim_slot_2_data_limit_size=0

# Default: none | Values: none, disable, sim-failover, sim-failover-sticky
sim_slot_2_data_limit_action=sim-failover

# Warning thresholds as percentages of the data limit (comma-separated; empty = no warnings)
# Default: (empty) | Values: comma-separated integers 1-100
sim_slot_2_data_limit_warning=75,90,95

# Default: 1 | Values: integer 1-28
sim_slot_2_data_limit_billing_date=1

# ============================================================================
# APN AUTO-DISCOVERY CONFIGURATION
# ============================================================================

# Android APN library integration
# Default: disabled | Values: enabled, disabled
android_apn_discovery=enabled

# Monitoring interval during stable operation (seconds)
# Default: 30 | Values: positive integer
normal_monitoring_interval=30

# ============================================================================
# NETWORK INTERFACE MANAGEMENT
# ============================================================================

# Enable network interface management
# Default: true | Values: true, false
interface_management_enabled=true

# Wait time before notifying Linux of link down on bearer loss (seconds)
# Default: 15 | Values: positive integer
bearer_disconnect_delay=15

# Debounce delay before acting on registration loss (seconds, 0 = immediate)
# Brief registration flaps shorter than this value are ignored
# Default: 20 | Values: integer >= 0
registration_recovery_delay=20

# Registration flap detection — trigger SIM failover on repeated network bouncing
# If this many registration losses occur within the flap window, the FSM treats it
# as an unstable network and fails over to the alternate SIM (if configured).
# Default: 5 | Values: positive integer (0 = disabled)
registration_flap_count=5

# Time window (seconds) for counting registration flaps
# Default: 360 | Values: positive integer
registration_flap_window=360

# Brief delay for IP change link cycling to allow DHCP renewal (milliseconds)
# Default: 500 | Values: integer >= 0
ip_change_delay=500

# Ensure Linux interface is UP when entering CONNECTED state
# Default: true | Values: true, false
ensure_link_up_on_connect=true

# Monitor ModemManager bearer state changes
# Default: true | Values: true, false
monitor_bearer_state=true

# Monitor for carrier IP address reassignments
# Default: true | Values: true, false
monitor_ip_changes=true

# Timeout for interface up/down operations (seconds)
# Default: 10 | Values: positive integer
interface_up_timeout=10

# ============================================================================
# CONNECTIVITY HEALTH MONITORING (ping tests)
# ============================================================================

# Enable ping-based connectivity monitoring
# Default: true | Values: true, false
connectivity_monitoring_enabled=true

# How often to test connectivity (seconds)
# Default: 60 | Values: integer >= 30
connectivity_monitoring_interval=60

# Ping timeout per attempt (seconds)
# Default: 10 | Values: integer >= 5
connectivity_monitoring_timeout=10

# Number of ping retries per target before declaring failure
# Default: 3 | Values: integer >= 1
connectivity_monitoring_retry_count=3

# Consecutive full failures before triggering reconnection
# Default: 2 | Values: integer >= 1
connectivity_monitoring_failure_threshold=2

# Test IPv4 connectivity
# Default: true | Values: true, false
connectivity_monitoring_test_ipv4=true

# Test IPv6 connectivity
# Default: false | Values: true, false
connectivity_monitoring_test_ipv6=false

# Require both IPv4 and IPv6 to pass (only relevant if both are tested)
# Default: false | Values: true, false
connectivity_monitoring_require_both=false

# IPv4 ping targets (comma-separated IP addresses)
# Default: 8.8.8.8,1.1.1.1 | Values: comma-separated IPv4 addresses
connectivity_monitoring_ipv4_targets=8.8.8.8,1.1.1.1,9.9.9.9

# IPv6 ping targets (comma-separated IP addresses)
# Default: 2001:4860:4860::8888,2606:4700:4700::1111 | Values: comma-separated IPv6 addresses
connectivity_monitoring_ipv6_targets=2001:4860:4860::8888,2606:4700:4700::1111

# ============================================================================
# SIM FAILOVER POLICY CONFIGURATION
# ============================================================================

# Number of connection attempts before triggering SIM failover
# Default: 3 | Values: integer 0-100
sim_failover_connect_retries=3

# Time to wait before reverting to primary SIM (seconds)
# Default: 300 | Values: integer 0-86400
sim_failover_revert_timer=300

# Time to wait for signal before declaring signal loss (seconds)
# Default: 60 | Values: integer 1-3600
sim_failover_signal_loss_timer=60

# Signal threshold for SIM failover trigger (dBm, negative value)
# Default: -90 | Values: integer (dBm, typically -50 to -120)
sim_failover_signal_threshold=-90

# ============================================================================
# DATA USAGE MONITORING
# ============================================================================
# Per-SIM data limits are configured above in each SIM slot section.

# How often to check bearer stats for data usage (seconds)
# Default: 30 | Values: positive integer
data_usage_monitoring_interval=30

# ============================================================================
# CONNECTION MODE
# ============================================================================

# Connection mode: how the modem manages the data bearer
#   always-on         — auto-connect at boot, stay connected (default)
#   connect-on-demand — register only, wait for D-Bus connect_bearer()
#   dial-on-demand    — auto-connect at boot, bearer managed via D-Bus
#                       connect_bearer() / disconnect_bearer() / get_bearer_status()
# Default: always-on | Values: always-on, connect-on-demand, dial-on-demand
connection_mode=always-on

# ============================================================================
# ADVANCED MODEM CONFIGURATION
# ============================================================================

# Hardware reset on connection failure
# Default: true | Values: true, false
hardware_reset_enabled=true

# Maximum hardware reset attempts before giving up
# Default: 3 | Values: positive integer
max_hardware_resets=3

# Hardware reset cooldown period (seconds)
# Default: 300 | Values: positive integer
hardware_reset_cooldown=300

# Connection timeout before declaring failure (seconds)
# Default: 120 | Values: positive integer
connection_timeout=120

# ============================================================================
# FAILED-STATE PERIODIC RETRY
# ============================================================================
# When the FSM enters FAILED (e.g. data plan exhausted, carrier provisioning
# delay), periodically reattempt the APN connection cascade using exponential
# backoff.  Covers data-plan top-up, monthly rollover, new SIM provisioning,
# and transient network-side errors.

# Enable periodic retry from FAILED state
# Default: true | Values: true, false
failed_retry_enabled=true

# Backoff intervals in seconds, comma-separated (stepped through in order)
# Default: 600,1800,3600,7200 | Values: comma-separated positive integers
failed_retry_intervals=600,1800,3600,7200

# Cap interval once the list is exhausted (seconds)
# Default: 1800 | Values: positive integer
failed_retry_max_interval=7200

# After this many consecutive failed retries, escalate to a modem
# disable/enable cycle (forces EPS detach/reattach) before the next
# Simple.Connect().  Clears stale network-side bearer context that
# Simple.Disconnect alone cannot reset (e.g. esm-sync-up-with-nw).
# 0 = never escalate.
# Default: 3 | Values: non-negative integer
failed_retry_escalation_threshold=3

# Network registration timeout (seconds)
# Default: 180 | Values: positive integer
registration_timeout=180

# Enable verbose logging for troubleshooting
# Default: true | Values: true, false
verbose_logging=true

# ============================================================================
# RADIO TECHNOLOGY AND NETWORK CONFIGURATION
# ============================================================================

# Network scan timeout (seconds)
# Default: 60 | Values: positive integer
network_scan_timeout=60

# Force specific network mode
# Default: auto | Values: auto, lte, 5g, 3g, 2g
network_mode=auto

# ============================================================================
# IPv6 BRIDGING (carrier /64 → one downstream LAN)
# ============================================================================
# Copies the carrier-supplied IPv6 prefix (typically /64) verbatim onto a
# single downstream LAN interface so SLAAC clients on that LAN can form
# globally-routable addresses.  This is NOT DHCPv6 PD — it is a one-prefix
# copy with no sub-delegation.  For real DHCPv6 PD (carrier-issued sub-
# prefix), use the standard VyOS 'set interfaces wwan wwan0 dhcpv6-options
# pd …' tree, which is handled by dhcp6c.
#
# ipv6_bridging is a JSON object: {"enabled": bool, "interface": "<lan>",
# "reconciliation_interval": <seconds>}.  When disabled or interface empty,
# the feature is off.
#
# Default: disabled | Values: JSON object
# Example:
#   ipv6_bridging={"enabled": true, "interface": "eth0"}
#
# ipv6_bridging={"enabled": false, "interface": ""}

# Safety-net reconciliation interval (seconds) — periodic re-check for the
# downstream LAN interface.  Netlink watch provides instant detection;
# this timer is a safety net for edge cases (interface destroy + recreate).
# May also be embedded in ipv6_bridging JSON as "reconciliation_interval".
# Default: 10 | Values: positive integer
bridging_reconciliation_interval=10

# ============================================================================
# SECURITY AND AUTHENTICATION (global defaults, per-SIM overrides above)
# ============================================================================

# APN is per-SIM only.
# Use sim_slot_1_apn, sim_slot_2_apn, etc.
# (Global apn removed — each SIM has its own APN)

# Username / password are per-SIM only.
# Use sim_slot_1_username, sim_slot_2_username, etc.
# (Global username/password removed — each SIM has its own credentials)

# Auth-type / PDP-type / roaming are per-SIM only.
# Use sim_slot_1_auth_type, sim_slot_1_pdp_type, sim_slot_1_roaming, etc.
# (Global auth_type/pdp_type/roaming removed — each SIM has its own settings)

# PIN / PUK are per-SIM only. If a PIN is configured, the FSM auto-unlocks.
# Use sim_slot_1_pin, sim_slot_2_pin, etc.
# (Global pin/puk removed — each SIM has its own PIN/PUK)

# ============================================================================
# LOGGING AND MONITORING
# ============================================================================

# Log level
# Default: info | Values: debug, info, warning, error
log_level=info

# Log destination sink
# Default: both | Values: both, journal, syslog
log_sink=both

# ============================================================================
# EXAMPLE PRODUCTION CONFIGURATIONS
# ============================================================================

# Example 1: Bell Canada LTE (Validated Working Configuration)
# interface_number=0
# primary_sim_slot=1
# sim_slot_1_apn=pda.bell.ca
# sim_slot_1_pin=1234
# reconnection_signal_threshold=-85
# connectivity_monitoring_enabled=true
# android_apn_discovery=enabled

# Example 2: T-Mobile US with automatic sim-failover and health monitoring
# interface_number=0
# primary_sim_slot=1
# sim_failover=enabled
# android_apn_discovery=enabled
# connectivity_monitoring_enabled=true
# connectivity_monitoring_interval=60
# connectivity_monitoring_failure_threshold=2
# sim_failover_connect_retries=3
# sim_slot_1_apn=fast.t-mobile.com
# sim_slot_1_data_limit_size=10000000000
# sim_slot_1_preferred_carrier=T-Mobile US
# sim_slot_2_apn=backup.carrier.com
# hardware_reset_enabled=true
# reconnection_signal_threshold=-85

# Example 3: Minimal setup for testing (Basic functionality only)
# interface_number=0
# primary_sim_slot=1
# sim_slot_1_apn=internet.apn
# connectivity_monitoring_enabled=false
# verbose_logging=true

# Lines starting with '#' are treated as comments.
