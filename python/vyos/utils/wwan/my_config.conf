
# The config file should be located in the same directory as this script,
# with the filename 'my_config.conf'.
# Its format is simple key=value pairs, one per line, for example:
#

# ============================================================================
# ENHANCED RECONNECTION STRATEGY CONFIGURATION
# ============================================================================
# Enhanced reconnection with signal quality validation (always enabled)
enhanced_reconnection = enabled

# Signal quality threshold for reconnection attempts (in dBm)
reconnection_signal_threshold = -85

# Retry intervals based on signal conditions (in seconds)
retry_interval_good_signal = 15  # Fast retry when signal > 50%
retry_interval_poor_signal = 45  # Slow retry when signal < 20%

# Maximum time to wait for signal improvement before attempting reconnection
max_wait_for_signal = 120

# Signal monitoring interval during recovery (in seconds)
signal_check_interval = 10

# Signal strength buffer to prevent oscillation (in dBm)
signal_strength_buffer = 5

# ============================================================================
# BASIC INTERFACE CONFIGURATION - This is equivalent to WWAN0, WWAN1, ...
# ============================================================================
interface_number=0

# ============================================================================
# SIM CONFIGURATION
# ============================================================================
# Which SIM slot to use (1 or 2)
active_sim_slot=1

# SIM failover - auto-switch to backup SIM on failure (enabled/disabled)
# DISABLED: Not fully tested yet - focus on basic functionality first
sim_failover=disabled

# SIM Slot 1 Configuration
# sim_slot_1_apn=lteinternet.apn  # Wrong APN for Bell
# sim_slot_1_apn=pda.bell.ca      # Correct Bell APN (discovered by Android library)
sim_slot_1_apn=
sim_slot_1_username=
sim_slot_1_password=
sim_slot_1_auth_type=chap
sim_slot_1_pdp_type=ipv4v6
sim_slot_1_roaming=disabled
sim_slot_1_pin=1234
sim_slot_1_puk=
sim_slot_1_auto_unlock=true
sim_slot_1_supported_bands=all
sim_slot_1_preferred_carrier=
sim_slot_1_enable_network_scan=false

# SIM Slot 2 Configuration (backup)
sim_slot_2_apn=
sim_slot_2_username=
sim_slot_2_password=
sim_slot_2_auth_type=none
sim_slot_2_pdp_type=ipv4
sim_slot_2_roaming=disabled
sim_slot_2_pin=5678
sim_slot_2_puk=
sim_slot_2_auto_unlock=true
sim_slot_2_supported_bands=all
sim_slot_2_preferred_carrier=
sim_slot_2_enable_network_scan=false

# ============================================================================
# APN AUTO-DISCOVERY CONFIGURATION
# ============================================================================
# Android APN library integration (enabled/disabled)
android_apn_discovery=enabled

# Cache successful APNs for faster reconnection (enabled/disabled)
apn_caching=enabled

# Normal monitoring interval during stable operation (seconds)
normal_monitoring_interval=30

# ============================================================================
# NETWORK INTERFACE MANAGEMENT
# ============================================================================
# Enable network interface management (true/false)
interface_management_enabled=true

# Wait time before notifying Linux of link down on bearer loss (seconds)
bearer_disconnect_delay=15

# Debounce delay before acting on registration loss (seconds, 0 = immediate)
# Brief registration flaps shorter than this value will be ignored entirely,
# preventing unnecessary IP re-application and interface cycling
registration_recovery_delay=5

# Brief delay for IP change link cycling to allow DHCP renewal (seconds)
ip_change_delay=0.5

# Ensure Linux interface is UP when entering CONNECTED state (true/false)
ensure_link_up_on_connect=true

# Monitor ModemManager bearer state changes (true/false)
monitor_bearer_state=true

# Monitor for carrier IP address reassignments (true/false)
monitor_ip_changes=true

# Timeout for interface up/down operations (seconds)
interface_up_timeout=10

# ============================================================================
# CONNECTIVITY HEALTH MONITORING
# ============================================================================
# Enable ping-based connectivity monitoring (true/false)
connectivity_monitoring_enabled=true

# How often to test connectivity (seconds, minimum 30)
connectivity_monitoring_interval=60

# Ping timeout per attempt (seconds, minimum 5)
connectivity_monitoring_timeout=10

# Number of ping retries per target (minimum 1)
connectivity_monitoring_retry_count=3

# Consecutive failures before triggering reconnection (minimum 1)
connectivity_monitoring_failure_threshold=2

# Test IPv4 connectivity (true/false)
connectivity_monitoring_test_ipv4=true

# Test IPv6 connectivity (true/false)
connectivity_monitoring_test_ipv6=false

# Require both IPv4 and IPv6 to work (true/false)
connectivity_monitoring_require_both=false

# IPv4 ping targets (comma-separated)
connectivity_monitoring_ipv4_targets=8.8.8.8,1.1.1.1,9.9.9.9

# IPv6 ping targets (comma-separated)
connectivity_monitoring_ipv6_targets=2001:4860:4860::8888,2606:4700:4700::1111

# ============================================================================
# FAILOVER CONFIGURATION
# ============================================================================
# Enable interface failover (enabled/disabled)
# DISABLED: Not fully tested yet - focus on basic connectivity first
failover=disabled

# Number of connection attempts before failover
failover_connect_retries=3

# Time to wait before reverting to primary interface (seconds)
failover_revert_timer=300

# Time to wait for signal before declaring signal loss (seconds)
failover_signal_loss_timer=60

# Signal threshold for failover trigger (dBm, negative value)
failover_signal_threshold=-90

# ============================================================================
# DATA USAGE MONITORING
# ============================================================================
# Action when data limit reached (disable/alert/throttle)
data_limit_action=disable

# Billing cycle start date (DD)
data_limit_billing_date=1

# Data limit in bytes (0 = unlimited)
data_limit_size=5000000000

# Data usage monitoring interval (seconds)
data_usage_monitoring_interval=30

# Data usage warning thresholds (comma-separated percentages)
data_usage_warning_thresholds=75,90,95

# ============================================================================
# DIAL-ON-DEMAND CONFIGURATION
# ============================================================================
# Enable dial-on-demand (enabled/disabled)
on_demand=disabled

# Idle timeout before disconnect (seconds, 0 = never disconnect)
on_demand_idle_timeout=300

# Traffic threshold to trigger connection (bytes per second)
on_demand_traffic_threshold=1024

# ============================================================================
# ADVANCED MODEM CONFIGURATION
# ============================================================================
# Hardware reset on connection failure (enabled/disabled)
hardware_reset_enabled=true

# Maximum hardware reset attempts
max_hardware_resets=3

# Hardware reset cooldown period (seconds)
hardware_reset_cooldown=300

# Connection timeout before declaring failure (seconds)
connection_timeout=120

# Network registration timeout (seconds)
registration_timeout=180

# Enable verbose logging for troubleshooting (true/false)
verbose_logging=true

# ============================================================================
# BAND AND CARRIER CONFIGURATION
# ============================================================================
# Supported bands (comma-separated: all, LTE, 5G, or specific band numbers)
supported_bands=all

# Preferred carrier/operator name
preferred_carrier=

# Enable automatic network scanning (true/false)
enable_network_scan=false

# Network scan timeout (seconds)
network_scan_timeout=60

# Force specific network mode (auto/lte/5g/3g/2g)
network_mode=auto

# ============================================================================
# SECURITY AND AUTHENTICATION
# ============================================================================
# Default APN (fallback if auto-discovery fails)
apn=lteinternet.apn

# Default username
username=

# Default password
password=

# Default authentication type (none/pap/chap/both)
auth_type=none

# Default PDP type (ipv4/ipv6/ipv4v6)
pdp_type=ipv4

# Enable roaming (enabled/disabled)
roaming=disabled

# Default PIN code
pin=

# Default PUK code
puk=

# Auto-unlock SIM with PIN (true/false)
auto_unlock=true

# ============================================================================
# LOGGING AND MONITORING
# ============================================================================
# Log level (debug/info/warning/error)
log_level=info

# Enable SNMP monitoring integration (true/false)
snmp_monitoring=true

# Send detailed status updates (true/false)
detailed_status=true

# Health check interval for overall system (seconds)
system_health_check_interval=300

# ============================================================================
# EXAMPLE PRODUCTION CONFIGURATION
# ============================================================================
# Example 1: Bell Canada LTE (Validated Working Configuration)
# interface_number=0
# active_sim_slot=1
# sim_slot_1_apn=pda.bell.ca
# sim_slot_1_pin=1234
# reconnection_signal_threshold=-85
# connectivity_monitoring_enabled=true
# android_apn_discovery=enabled

# Example 2: T-Mobile US with automatic failover and health monitoring
# interface_number=0
# active_sim_slot=1
# sim_failover=enabled
# android_apn_discovery=enabled
# connectivity_monitoring_enabled=true
# connectivity_monitoring_interval=60
# connectivity_monitoring_failure_threshold=2
# failover=enabled
# failover_connect_retries=3
# data_limit_size=10000000000
# sim_slot_1_apn=fast.t-mobile.com
# sim_slot_1_preferred_carrier=T-Mobile US
# sim_slot_2_apn=backup.carrier.com
# hardware_reset_enabled=true
# reconnection_signal_threshold=-85

# Example 3: Minimal setup for testing (Basic functionality only)
# interface_number=0
# active_sim_slot=1
# sim_slot_1_apn=internet.apn
# connectivity_monitoring_enabled=false
# verbose_logging=true

# Lines starting with '#' are treated as comments.
